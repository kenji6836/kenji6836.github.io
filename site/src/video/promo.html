<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Sweepfield — 15s promo (1080×1920)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=block" rel="stylesheet">
<style>
/* ---- palette: taken from the Sweepfield icon (cream / soil / moss / poppy) ---- */
:root{
  --cream:#f6f3e6; --cream2:#ebe6d2; --soil:#7d5a3a; --soil2:#5a3d27; --moss:#a3bd98; --moss2:#dbe7cd;
  --pine:#2f5a3b; --pine2:#1f3627; --poppy:#e0513a; --poppy2:#c43d29; --ink:#2a2822; --sun:#f2c14e; --sky:#7fa6d6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);position:relative;font-feature-settings:"palt";-webkit-font-smoothing:antialiased}
img{display:block}
.stage{position:absolute;inset:0;overflow:hidden;perspective:2600px;perspective-origin:50% 45%}

/* ---- background ---- */
.bg{position:absolute;inset:0;background:
  radial-gradient(900px 700px at 8% 6%, rgba(163,189,152,.55), transparent 65%),
  radial-gradient(900px 800px at 96% 92%, rgba(224,81,58,.28), transparent 65%),
  radial-gradient(700px 600px at 85% 20%, rgba(242,193,78,.22), transparent 65%),
  linear-gradient(180deg,#f8f5ea 0%,var(--cream) 50%,var(--cream2) 100%)}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(90,61,39,.16) 1.6px, transparent 1.7px);background-size:44px 44px;opacity:.55}

/* ---- generic in/out wrappers (each element gets ONE animation per property) ---- */
.in{animation:rise .6s cubic-bezier(.16,.9,.25,1) var(--in) both}
.in.pop{animation:pop .55s cubic-bezier(.34,1.56,.64,1) var(--in) both}
.in.popBig{animation:popBig .7s cubic-bezier(.34,1.4,.64,1) var(--in) both}
.in.fade{animation:fade .5s ease-out var(--in) both}
.out{animation:out .4s cubic-bezier(.55,0,.7,.3) var(--out) both}
.out.shrink{animation:shrinkOut .45s cubic-bezier(.6,0,.8,.4) var(--out) both}
@keyframes rise{from{transform:translateY(110%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{from{transform:translateY(40px) scale(.6);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes popBig{from{transform:translateY(60px) scale(.4);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes out{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
@keyframes shrinkOut{from{transform:scale(1) translateY(0);opacity:1}to{transform:scale(.86) translateY(80px);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.float{animation:bob 3s ease-in-out var(--fl,0s) infinite both}

/* ---- typography ---- */
.kicker{position:absolute;left:0;right:0;text-align:center;font-family:Fraunces,serif;font-weight:600;font-size:30px;letter-spacing:.28em;color:var(--soil);text-transform:uppercase}
.kicker .in{display:inline-block}
.hl{position:absolute;left:80px;right:80px}
.hl.center{text-align:center}
.line{overflow:hidden;padding:0 .06em;line-height:1.18}
.line .in,.line .out{display:block}
.t1{font-size:132px;font-weight:900;letter-spacing:-.02em}
.t2{font-size:96px;font-weight:900;letter-spacing:-.01em}
.t3{font-size:150px;font-weight:900;letter-spacing:-.02em}
.poppy{color:var(--poppy)}.pine{color:var(--pine)}.soil{color:var(--soil)}

/* ---- scene 1: kinetic tile grid ---- */
.gridwrap{position:absolute;left:188px;top:800px;width:704px;height:704px;transform-style:preserve-3d}
.grid{display:grid;grid-template-columns:repeat(5,128px);gap:16px;transform:rotateX(14deg) rotateZ(-3deg);transform-style:preserve-3d}
.tile{width:128px;height:128px;perspective:900px;animation:tilePop .55s cubic-bezier(.34,1.5,.64,1) var(--d) both}
@keyframes tilePop{from{transform:scale(0) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.card.rev{animation:flip .65s cubic-bezier(.5,0,.2,1) var(--f) both}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.face.front{background:linear-gradient(160deg,#8f6846 0%,#6d4a31 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.22),inset 0 -6px 0 rgba(0,0,0,.18),0 18px 30px -12px rgba(60,40,20,.55)}
.face.front::after{content:"";position:absolute;inset:0;border-radius:24px;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.4px);background-size:11px 11px;opacity:.6}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#e3edd6 0%,#c9dcb9 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(47,90,59,.14),0 18px 30px -14px rgba(60,40,20,.45);font-family:Fraunces,serif;font-weight:700;font-size:78px;color:var(--pine)}
.face.back svg{width:66px;height:66px}

/* ticker */
.ticker{position:absolute;left:0;right:0;top:1650px;height:64px;overflow:hidden;font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:36px;letter-spacing:.14em;color:var(--soil);white-space:nowrap}
.ticker .in,.ticker .out{display:block}
.track{display:inline-flex;animation:ticker 16s linear 0s infinite both;will-change:transform}
.track span{padding:0 .6em;display:inline-flex;align-items:center;gap:1.2em}
.track i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--poppy)}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---- phone frame (screenshot aspect 780:1695 preserved: 660×1434) ---- */
.phone{position:absolute;left:194px;top:560px;width:692px;height:1466px;border-radius:92px;background:#1d1b17;padding:16px;
  box-shadow:0 70px 120px -30px rgba(50,32,16,.6),0 30px 50px -30px rgba(50,32,16,.5),inset 0 0 0 2px rgba(255,255,255,.08);
  transform-style:preserve-3d;animation:phoneMove 10.4s linear 2.4s both;will-change:transform}
.phone::before{content:"";position:absolute;left:-6px;top:330px;width:6px;height:130px;border-radius:4px 0 0 4px;background:#2a2723}
.phone::after{content:"";position:absolute;right:-6px;top:400px;width:6px;height:190px;border-radius:0 4px 4px 0;background:#2a2723}
.screen{position:relative;width:660px;height:1434px;border-radius:76px;overflow:hidden;background:#f5f2e6}
.scr{position:absolute;inset:0;width:660px;height:1434px;object-fit:cover}
.scr.s3{animation:screenIn .45s cubic-bezier(.16,.9,.25,1) 6.3s both}
.scr.s2{animation:screenIn .45s cubic-bezier(.16,.9,.25,1) 9.8s both}
@keyframes screenIn{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:translateY(0)}}
.glare{position:absolute;inset:0;border-radius:76px;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.05) 28%,transparent 45%);pointer-events:none}
@keyframes phoneMove{
  0%{transform:translate3d(0,1500px,0) rotateX(18deg) rotateY(-20deg) scale(1);animation-timing-function:cubic-bezier(.16,.9,.25,1)}
  8.654%{transform:translate3d(0,0,0) rotateX(3deg) rotateY(-9deg) scale(1)}
  33.654%{transform:translate3d(0,0,0) rotateX(3deg) rotateY(-9deg) scale(1);animation-timing-function:cubic-bezier(.6,0,.2,1)}
  39.423%{transform:translate3d(180px,50px,0) rotateX(2deg) rotateY(-17deg) scale(.95)}
  66.346%{transform:translate3d(180px,50px,0) rotateX(2deg) rotateY(-17deg) scale(.95);animation-timing-function:cubic-bezier(.6,0,.2,1)}
  72.115%{transform:translate3d(0,-30px,0) rotateX(0) rotateY(0) scale(1)}
  100%{transform:translate3d(0,-30px,0) rotateX(0) rotateY(0) scale(1)}
}

/* ---- floating chips ---- */
.chip{position:absolute;display:inline-flex;align-items:center;gap:18px;padding:18px 34px 18px 18px;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:40px;letter-spacing:.01em;white-space:nowrap;
  box-shadow:0 26px 50px -18px rgba(60,40,20,.45),0 2px 0 rgba(255,255,255,.8) inset}
.chip .ic{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.chip .ic svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ic.poppy{background:var(--poppy)}.ic.pine{background:var(--pine)}.ic.moss{background:var(--moss)}.ic.soil{background:var(--soil)}
.chip.sm{font-size:34px;padding:14px 28px 14px 14px}
.chip.sm .ic{width:52px;height:52px}.chip.sm .ic svg{width:30px;height:30px}

/* ---- petals (scene 4) ---- */
.petal{position:absolute;top:0;left:var(--x);width:var(--w,30px);height:var(--h,30px);border-radius:50%;background:var(--c);opacity:0;
  animation:fall var(--dur,2.6s) cubic-bezier(.3,.1,.7,.9) var(--d) both}
.petal.leaf{border-radius:60% 0 60% 0}
@keyframes fall{0%{transform:translate3d(0,-160px,0) rotate(0deg);opacity:0}6%{opacity:1}100%{transform:translate3d(var(--dx,0px),2100px,0) rotate(var(--rot,360deg));opacity:1}}

/* ---- end card ---- */
.end{position:absolute;inset:0;background:var(--pine2);z-index:50;animation:endIn .75s cubic-bezier(.7,0,.2,1) 12.4s both;overflow:hidden}
@keyframes endIn{from{clip-path:circle(0% at 50% 96%)}to{clip-path:circle(135% at 50% 96%)}}
.end .hill{position:absolute;left:-300px;right:-300px;bottom:-520px;height:900px;border-radius:50%;background:#27422f}
.end .hill2{position:absolute;left:-200px;right:-500px;bottom:-640px;height:900px;border-radius:50%;background:#2e4c37}
.end .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(246,243,230,.10) 1.6px,transparent 1.7px);background-size:44px 44px}
.end .icon{position:absolute;left:380px;top:430px;width:320px;height:320px;border-radius:72px;overflow:hidden;box-shadow:0 50px 90px -30px rgba(0,0,0,.6),0 0 0 6px rgba(246,243,230,.10)}
.end .icon img{width:320px;height:320px}
.end .icon .in{display:block}
.end .brand{position:absolute;left:0;right:0;top:820px;text-align:center;font-family:Fraunces,serif;font-weight:700;font-size:132px;letter-spacing:-.02em;color:var(--cream);line-height:1.1}
.end .tag{position:absolute;left:0;right:0;top:1000px;text-align:center;font-size:48px;font-weight:700;color:rgba(246,243,230,.86);line-height:1.3}
.end .pill{position:absolute;left:0;right:0;top:1160px;text-align:center}
.end .pill .in{display:inline-block}
.end .pill .btn{display:inline-flex;align-items:center;gap:18px;padding:26px 54px 26px 40px;border-radius:999px;background:var(--cream);color:var(--pine2);font-weight:900;font-size:46px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.end .pill .btn svg{width:46px;height:46px;stroke:var(--pine2);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.end .note{position:absolute;left:0;right:0;top:1330px;text-align:center;font-size:32px;font-weight:700;color:rgba(246,243,230,.6);letter-spacing:.04em}
.end .note .in{display:inline-block}
.end .kicker{top:330px;color:rgba(246,243,230,.55)}
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>

  <!-- ===== Scene 1 (0–2.5s): hook ===== -->
  <div class="kicker" style="top:160px"><div class="in" style="--in:.15s"><div class="out" style="--out:2.1s">Sweepfield · Daily Minesweeper</div></div></div>
  <div class="hl" style="top:250px">
    <div class="line"><div class="in" style="--in:.25s"><div class="out" style="--out:2.1s"><span class="t1">毎日、</span></div></div></div>
    <div class="line"><div class="in" style="--in:.38s"><div class="out" style="--out:2.14s"><span class="t1">世界で</span></div></div></div>
    <div class="line"><div class="in" style="--in:.5s"><div class="out" style="--out:2.18s"><span class="t1 poppy">同じ盤面。</span></div></div></div>
  </div>
  <div class="gridwrap"><div class="out shrink" style="--out:2.08s"><div class="grid" id="grid"></div></div></div>
  <div class="ticker"><div class="in fade" style="--in:.7s"><div class="out" style="--out:2.1s"><div class="track" id="track"></div></div></div></div>

  <!-- ===== Scene 2 (2.5–6s): phone + 推測なし ===== -->
  <div class="hl" style="top:170px">
    <div class="line"><div class="in" style="--in:2.75s"><div class="out" style="--out:5.7s"><span class="t1 poppy">推測なし。</span></div></div></div>
    <div class="line"><div class="in" style="--in:2.9s"><div class="out" style="--out:5.75s"><span class="t2">論理だけで解ける。</span></div></div></div>
  </div>

  <!-- ===== Scene 3 (6–9.5s): features ===== -->
  <div class="hl" style="top:170px">
    <div class="line"><div class="in" style="--in:6.25s"><div class="out" style="--out:9.2s"><span class="t1">だれでも、</span></div></div></div>
    <div class="line"><div class="in" style="--in:6.4s"><div class="out" style="--out:9.25s"><span class="t2 pine">遊べる設計。</span></div></div></div>
  </div>

  <!-- ===== Scene 4 (9.5–12.5s): 今日の盤面 ===== -->
  <div class="hl" style="top:150px">
    <div class="line"><div class="in" style="--in:9.75s"><div class="out" style="--out:12.45s"><span class="t2">今日の盤面、</span></div></div></div>
    <div class="line"><div class="in" style="--in:9.9s"><div class="out" style="--out:12.5s"><span class="t3 poppy">解ける？</span></div></div></div>
  </div>

  <!-- phone (persists 2.4s → end) -->
  <div class="phone">
    <div class="screen">
      <img class="scr s1" src="../../../assets/works/sweepfield-1.jpg" alt="">
      <img class="scr s3" src="../../../assets/works/sweepfield-3.jpg" alt="">
      <img class="scr s2" src="../../../assets/works/sweepfield-2.jpg" alt="">
      <div class="glare"></div>
    </div>
  </div>

  <!-- scene 2 chips -->
  <div class="in pop" style="--in:3.6s;position:absolute;left:620px;top:720px"><div class="out" style="--out:5.7s"><div class="chip float" style="--fl:-.4s"><span class="ic poppy"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>推測なしで解ける</div></div></div>
  <div class="in pop" style="--in:3.85s;position:absolute;left:60px;top:1240px"><div class="out" style="--out:5.7s"><div class="chip float" style="--fl:-1.6s"><span class="ic pine"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg></span>世界で同じ盤面</div></div></div>

  <!-- scene 3 chips -->
  <div class="in pop" style="--in:6.9s;position:absolute;left:70px;top:860px"><div class="out" style="--out:9.2s"><div class="chip float" style="--fl:-.2s"><span class="ic pine"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg></span>VoiceOver 対応</div></div></div>
  <div class="in pop" style="--in:7.15s;position:absolute;left:70px;top:1010px"><div class="out" style="--out:9.25s"><div class="chip float" style="--fl:-1.1s"><span class="ic poppy"><svg viewBox="0 0 24 24"><path d="M4 19l5-13 5 13M6.2 14.5h5.6"/><path d="M15 19l2.5-7 2.5 7M16 16.8h3"/></svg></span>Dynamic Type</div></div></div>
  <div class="in pop" style="--in:7.4s;position:absolute;left:70px;top:1160px"><div class="out" style="--out:9.3s"><div class="chip float" style="--fl:-2s"><span class="ic moss"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg></span>多言語対応</div></div></div>

  <!-- scene 4 chip -->
  <div class="in pop" style="--in:10.6s;position:absolute;left:640px;top:760px"><div class="out" style="--out:12.45s"><div class="chip float" style="--fl:-.7s"><span class="ic poppy"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.4 6.7 19.2l1.1-5.9L3.5 9.2l5.9-.8z"/></svg></span>解けた！</div></div></div>

  <!-- petals -->
  <div class="petal" style="--x:120px;--c:#e0513a;--w:34px;--h:46px;--d:9.9s;--dx:80px;--rot:420deg"></div>
  <div class="petal" style="--x:300px;--c:#f2c14e;--w:26px;--h:26px;--d:10.15s;--dx:-60px;--rot:300deg;--dur:2.9s"></div>
  <div class="petal leaf" style="--x:480px;--c:#a3bd98;--w:40px;--h:40px;--d:10.0s;--dx:40px;--rot:520deg"></div>
  <div class="petal" style="--x:660px;--c:#e0513a;--w:30px;--h:42px;--d:10.3s;--dx:-90px;--rot:380deg;--dur:2.7s"></div>
  <div class="petal" style="--x:840px;--c:#ffffff;--w:24px;--h:24px;--d:10.05s;--dx:50px;--rot:200deg;--dur:3.0s"></div>
  <div class="petal" style="--x:960px;--c:#7fa6d6;--w:28px;--h:28px;--d:10.4s;--dx:-70px;--rot:330deg"></div>
  <div class="petal leaf" style="--x:60px;--c:#a3bd98;--w:36px;--h:36px;--d:10.55s;--dx:120px;--rot:460deg;--dur:2.8s"></div>
  <div class="petal" style="--x:220px;--c:#c43d29;--w:32px;--h:44px;--d:10.7s;--dx:-40px;--rot:400deg"></div>
  <div class="petal" style="--x:400px;--c:#ffffff;--w:22px;--h:22px;--d:10.85s;--dx:70px;--rot:260deg;--dur:2.5s"></div>
  <div class="petal" style="--x:560px;--c:#f2c14e;--w:28px;--h:28px;--d:10.6s;--dx:-100px;--rot:350deg;--dur:2.9s"></div>
  <div class="petal" style="--x:740px;--c:#e0513a;--w:36px;--h:48px;--d:10.95s;--dx:60px;--rot:440deg;--dur:2.6s"></div>
  <div class="petal leaf" style="--x:900px;--c:#a3bd98;--w:34px;--h:34px;--d:10.75s;--dx:-50px;--rot:500deg;--dur:2.7s"></div>
  <div class="petal" style="--x:1000px;--c:#c43d29;--w:30px;--h:40px;--d:11.1s;--dx:-120px;--rot:390deg;--dur:2.4s"></div>
  <div class="petal" style="--x:360px;--c:#7fa6d6;--w:26px;--h:26px;--d:11.2s;--dx:90px;--rot:280deg;--dur:2.5s"></div>
  <div class="petal" style="--x:620px;--c:#ffffff;--w:20px;--h:20px;--d:11.35s;--dx:-30px;--rot:240deg;--dur:2.3s"></div>
  <div class="petal" style="--x:160px;--c:#f2c14e;--w:24px;--h:24px;--d:11.5s;--dx:60px;--rot:320deg;--dur:2.2s"></div>

  <!-- ===== Scene 5 (12.5–15s): end card ===== -->
  <div class="end">
    <div class="dots"></div>
    <div class="hill2"></div><div class="hill"></div>
    <div class="kicker"><div class="in fade" style="--in:12.9s">Daily Minesweeper</div></div>
    <div class="icon"><div class="in popBig" style="--in:12.75s"><img src="../../../assets/works/sweepfield-icon.png" alt=""></div></div>
    <div class="brand"><div class="line"><div class="in" style="--in:12.95s">Sweepfield</div></div></div>
    <div class="tag"><div class="line"><div class="in" style="--in:13.1s">毎日ひとつ、世界で同じ盤面。</div></div></div>
    <div class="pill"><div class="in pop" style="--in:13.3s"><span class="btn"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>App Store で公開中</span></div></div>
    <div class="note"><div class="in fade" style="--in:13.55s">無料 · 広告非表示の買い切りあり</div></div>
  </div>
</div>

<script>
// ---- deterministic content (no Math.random / no timers) ----
(function(){
  const grid=document.getElementById('grid');
  // 5×5 board; reveal a cross-shaped region + two "flowers" (flags)
  const sprout='<svg viewBox="0 0 24 24" fill="none" stroke="#2f5a3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 13c-4 0-6-2.5-6-6 4 0 6 2.5 6 6z"/><path d="M12 11c4 0 6-2.5 6-6-4 0-6 2.5-6 6z"/></svg>';
  const poppy='<svg viewBox="0 0 24 24"><g fill="#e0513a"><circle cx="12" cy="7.2" r="3.4"/><circle cx="7.4" cy="10.6" r="3.4"/><circle cx="16.6" cy="10.6" r="3.4"/><circle cx="9.2" cy="15.6" r="3.4"/><circle cx="14.8" cy="15.6" r="3.4"/></g><circle cx="12" cy="11.6" r="2.2" fill="#3a2a1e"/></svg>';
  const rev={ '1,1':'1','1,2':'2','1,3':'1','2,1':'2','2,2':sprout,'2,3':'2','3,1':'1','3,2':'2','3,3':'1','0,4':poppy,'4,0':poppy };
  const flipDelay={ '2,2':0.8,'1,2':0.9,'2,1':0.92,'2,3':0.94,'3,2':0.96,'1,1':1.04,'1,3':1.06,'3,1':1.08,'3,3':1.1,'0,4':1.3,'4,0':1.36 };
  let html='';
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){
    const k=r+','+c, d=(0.02+(r+c)*0.06).toFixed(2);
    const content=rev[k]; const isRev=content!==undefined;
    html+=`<div class="tile" style="--d:${d}s"><div class="card${isRev?' rev':''}"${isRev?` style="--f:${flipDelay[k]}s"`:''}><div class="face front"></div>${isRev?`<div class="face back">${content}</div>`:''}</div></div>`;
  }
  grid.innerHTML=html;
  const cities=['Tokyo','New York','London','Paris','Berlin','Seoul','São Paulo','Sydney','Toronto','Mumbai'];
  const seg='<span>'+cities.map(c=>c+'<i></i>').join('')+'</span>';
  document.getElementById('track').innerHTML=seg+seg;
})();

// ---- deterministic seek API for the frame renderer ----
window.__duration=15;
window.__ready=(async()=>{
  try{ if(document.fonts) await document.fonts.ready; }catch(e){}
  await Promise.all([...document.images].map(im=>new Promise(res=>{
    const done=()=>{ (im.decode?im.decode().catch(()=>{}):Promise.resolve()).then(res,res); };
    if(im.complete) done(); else { im.onload=done; im.onerror=res; }
  })));
  return true;
})();
window.__seek=async function(t){
  await window.__ready;
  const ms=Math.max(0,+t)*1000;
  for(const a of document.getAnimations()){ a.pause(); a.currentTime=ms; }
  void document.body.offsetHeight; // flush style/layout
  await new Promise(r=>{ let done=false; const f=()=>{ if(!done){done=true;r();} }; requestAnimationFrame(()=>requestAnimationFrame(f)); setTimeout(f,150); });
  return t;
};
</script>
