<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ヒナタ塗装店 バナー広告セット（自主制作サンプル）</title>
<!-- usage: banner.html?size=square|story|landscape|rect&v=a|b[&art=photo|illust][&photo=wall|house]  → render with site/tools/cdp-render.mjs (default art=photo; photo defaults to wall for A, house for B) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#132447; --navy2:#1c3563; --ink:#0d1a33;
  --orange:#f4862a; --orange2:#e26f12; --yellow:#ffc83d; --cream:#fff4dc;
  --white:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#222;font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--white);-webkit-font-smoothing:antialiased}
.ad{position:relative;overflow:hidden;background:
  radial-gradient(circle at 78% 62%, rgba(255,200,61,.22) 0, rgba(255,200,61,0) 34%),
  radial-gradient(circle at 12% 8%, rgba(244,134,42,.20) 0, rgba(244,134,42,0) 40%),
  linear-gradient(160deg,var(--navy2) 0%,var(--navy) 55%,var(--ink) 100%)}
.ad>*{position:absolute}
/* decorative dots */
.dots{inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.6px);background-size:36px 36px;opacity:.9}
/* logo */
.logo{display:flex;align-items:center;gap:.28em;line-height:1}
.logo .mark{flex:none}
.logo .name{font-weight:900;letter-spacing:.02em;color:var(--white)}
.logo .tag{font-weight:700;color:rgba(255,255,255,.72);letter-spacing:.08em}
.logo .txt{display:flex;flex-direction:column;gap:.18em}
/* campaign pill */
.pill{display:inline-flex;align-items:center;gap:.4em;background:var(--yellow);color:var(--ink);font-weight:900;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.pill .leaf{flex:none}
/* headline */
.head{white-space:nowrap;line-height:1}
.head .lead{font-weight:900;color:var(--white);letter-spacing:.02em}
.head .big{display:flex;align-items:baseline;line-height:.9}
.head .num{font-family:Montserrat,"Noto Sans JP",sans-serif;font-weight:900;color:var(--yellow);letter-spacing:-.04em;text-shadow:0 .04em 0 rgba(0,0,0,.18)}
.head .unit{font-weight:900;color:var(--white)}
.head .ja{font-weight:900;color:var(--yellow);letter-spacing:.01em}
.sub{font-weight:700;color:rgba(255,255,255,.92);line-height:1.45;white-space:nowrap}
.chips{display:flex;gap:.5em;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:.35em;border:2px solid rgba(255,255,255,.55);border-radius:999px;font-weight:700;color:var(--white);line-height:1}
.chip .ck{flex:none}
/* CTA */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:.5em;background:var(--orange);color:var(--white);font-weight:900;border-radius:999px;white-space:nowrap;box-shadow:0 .18em .55em rgba(0,0,0,.28);letter-spacing:.03em}
.cta .arr{flex:none}
.note{font-weight:700;color:rgba(255,255,255,.78);white-space:nowrap;letter-spacing:.02em}
.leaves{line-height:0;display:none}
.leaves svg{width:100%;height:auto;display:block}
.house{line-height:0}
.house svg{width:100%;height:auto;display:block;overflow:visible}
.sample{font-weight:700;color:rgba(255,255,255,.45);letter-spacing:.12em;white-space:nowrap}

/* photo panel (art=photo, default): cover crop + navy tint + edge fade into the page */
.photo{overflow:hidden;display:none}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 45%}
.photo .tint{position:absolute;inset:0;background:rgba(20,30,60,.15)}
.band{display:none;background:linear-gradient(180deg,rgba(19,36,71,0) 0,rgba(19,36,71,.8) 12%,rgba(19,36,71,.8) 88%,rgba(19,36,71,0) 100%)}
.art-photo .photo{display:block}
.art-photo .house{display:none}
.art-photo .leaves .l4{display:none}
.art-illust .photo{display:none}

/* ---------- SQUARE 1080x1080 ---------- */
.size-square .ad{width:1080px;height:1080px}
.size-square .logo{left:72px;top:64px}
.size-square .logo .mark{width:72px;height:72px}
.size-square .logo .name{font-size:42px}
.size-square .logo .tag{font-size:19px}
.size-square .pill{right:72px;top:74px;font-size:27px;padding:.5em 1em}
.size-square .pill .leaf{width:1.1em;height:1.1em}
.size-square .head{left:72px;top:238px}
.size-square .head .lead{font-size:100px}
.size-square .head .big{margin-top:14px;gap:10px}
.size-square .head .num{font-size:330px}
.size-square .head .unit{font-size:130px}
.size-square .head .ja{font-size:112px;margin-top:22px}
.size-square .sub{left:72px;top:716px;font-size:36px}
.size-square .chips{left:72px;top:826px;font-size:26px}
.size-square .chip{padding:.45em .9em}
.size-square .chip .ck{width:1em;height:1em}
.size-square .cta{left:72px;top:922px;height:104px;padding:0 46px;font-size:38px}
.size-square .cta .arr{width:.9em;height:.9em}
.size-square .note{left:72px;top:1036px;font-size:22px;display:none}
.size-square .house{right:-50px;bottom:44px;width:620px}
.size-square .leaves{display:block;right:150px;top:190px;width:300px}
.size-square .sample{right:72px;top:158px;font-size:18px}
.size-square .photo{left:440px;top:300px;right:0;bottom:0;mask-image:linear-gradient(90deg,transparent 0,#000 36%),linear-gradient(180deg,transparent 0,#000 32%);mask-composite:intersect;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 36%),linear-gradient(180deg,transparent 0,#000 32%);-webkit-mask-composite:source-in}
.size-square .photo img{object-position:72% 40%}
.size-square .photo img.ph-house{object-position:60% 50%}
.size-square.photo-house .photo{mask-image:linear-gradient(90deg,transparent 0,#000 46%),linear-gradient(180deg,transparent 0,#000 44%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 46%),linear-gradient(180deg,transparent 0,#000 44%)}

/* ---------- STORY 1080x1920 (safe zone: keep text within y 270..1536) ---------- */
.size-story .ad{width:1080px;height:1920px}
.size-story .logo{left:80px;top:300px}
.size-story .logo .mark{width:80px;height:80px}
.size-story .logo .name{font-size:46px}
.size-story .logo .tag{font-size:21px}
.size-story .pill{left:80px;top:420px;font-size:30px;padding:.5em 1em}
.size-story .pill .leaf{width:1.1em;height:1.1em}
.size-story .head{left:80px;top:512px}
.size-story .head .lead{font-size:124px}
.size-story .head .big{margin-top:16px;gap:14px}
.size-story .head .num{font-size:430px}
.size-story .head .unit{font-size:166px}
.size-story .head .ja{font-size:128px;margin-top:24px}
.size-story .sub{left:80px;top:1090px;font-size:42px}
.size-story .chips{left:80px;top:1216px;font-size:29px}
.size-story .chip{padding:.45em .9em}
.size-story .chip .ck{width:1em;height:1em}
.size-story .cta{left:80px;top:1300px;height:118px;padding:0 56px;font-size:46px}
.size-story .cta .arr{width:.9em;height:.9em}
.size-story .note{left:80px;top:1444px;font-size:27px}
.size-story .leaves{display:block;right:110px;top:420px;width:360px}
.size-story .house{right:-40px;bottom:-10px;width:700px}
.size-story .sample{right:80px;top:322px;font-size:20px}
.size-story .photo{left:0;right:0;top:940px;bottom:-500px;mask-image:linear-gradient(180deg,transparent 0,rgba(0,0,0,.35) 22%,#000 40%);-webkit-mask-image:linear-gradient(180deg,transparent 0,rgba(0,0,0,.35) 22%,#000 40%)}
.size-story .photo img{object-position:50% 62%}
.size-story .band{display:block;left:0;right:0;top:1280px;height:224px}

/* ---------- LANDSCAPE 1200x628 ---------- */
.size-landscape .ad{width:1200px;height:628px}
.size-landscape .logo{left:56px;top:44px}
.size-landscape .logo .mark{width:56px;height:56px}
.size-landscape .logo .name{font-size:32px}
.size-landscape .logo .tag{font-size:15px}
.size-landscape .pill{left:56px;top:128px;font-size:22px;padding:.45em .95em}
.size-landscape .pill .leaf{width:1.1em;height:1.1em}
.size-landscape .head{left:56px;top:196px}
.size-landscape .head .lead{font-size:64px}
.size-landscape .head .big{margin-top:6px;gap:6px}
.size-landscape .head .num{font-size:210px}
.size-landscape .head .unit{font-size:84px}
.size-landscape .head .ja{font-size:72px;margin-top:14px}
.size-landscape .sub{left:352px;top:300px;font-size:28px}
.size-landscape .chips{left:352px;top:406px;font-size:20px}
.size-landscape .chip{padding:.42em .85em}
.size-landscape .chip .ck{width:1em;height:1em}
.size-landscape .cta{left:56px;top:492px;height:80px;padding:0 36px;font-size:30px}
.size-landscape .cta .arr{width:.9em;height:.9em}
.size-landscape .note{display:none}
.size-landscape .house{right:8px;bottom:-4px;width:560px}
.size-landscape .sample{left:56px;top:592px;font-size:15px}
.size-landscape .photo{left:640px;top:0;right:0;bottom:0;mask-image:linear-gradient(90deg,transparent 0,#000 42%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 42%)}
.size-landscape .photo img{object-position:66% 45%}

/* ---------- RECT 300x250 (rendered at scale 2 → 600x500) ---------- */
.size-rect .ad{width:300px;height:250px}
.size-rect .dots{background-size:18px 18px}
.size-rect .logo{left:16px;top:14px}
.size-rect .logo .mark{width:26px;height:26px}
.size-rect .logo .name{font-size:15px}
.size-rect .logo .tag{display:none}
.size-rect .pill{left:16px;top:52px;font-size:11px;padding:.38em .8em}
.size-rect .pill .leaf{width:1.1em;height:1.1em}
.size-rect .head{left:16px;top:84px}
.size-rect .head .lead{font-size:26px}
.size-rect .head .big{margin-top:2px;gap:3px}
.size-rect .head .num{font-size:82px}
.size-rect .head .unit{font-size:34px}
.size-rect .head .ja{font-size:28px;margin-top:6px}
.size-rect .sub,.size-rect .chips,.size-rect .note{display:none}
.size-rect .cta{left:16px;top:198px;height:38px;padding:0 17px;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.28)}
.size-rect .cta .arr{width:.9em;height:.9em}
.size-rect .house{right:-12px;bottom:-2px;width:158px}
.size-rect .sample{display:none}
.size-rect .photo{left:172px;top:0;right:0;bottom:0;mask-image:linear-gradient(90deg,transparent 0,#000 40%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40%)}
.size-rect .photo img{object-position:80% 45%}

/* variant B tweaks (3-char unit needs a tighter number) */
.size-square.v-b .head .num{font-size:290px}
.size-square.v-b .head .unit{font-size:100px}
.size-story.v-b .head .num{font-size:340px}
.size-story.v-b .head .unit{font-size:118px}
.size-landscape.v-b .head .num{font-size:190px}
.size-landscape.v-b .head .unit{font-size:66px}
.size-rect.v-b .head .num{font-size:74px}
.size-rect.v-b .head .unit{font-size:26px}
</style>
</head>
<body>
<div class="ad">
  <div class="dots"></div>
  <div class="photo"><img src="photos/ad-wall.jpg" alt=""><div class="tint"></div></div>
  <div class="band"></div>

  <div class="logo">
    <svg class="mark" viewBox="0 0 80 80" aria-hidden="true">
      <circle cx="40" cy="40" r="38" fill="#ffc83d"/>
      <circle cx="40" cy="40" r="30" fill="#f4862a"/>
      <path d="M40 10a30 30 0 0 1 0 60Z" fill="#d9711f" opacity=".55"/>
      <!-- roof + wall inside sun -->
      <path d="M22 41 L40 25 L58 41 Z" fill="#132447"/>
      <rect x="27" y="41" width="26" height="17" rx="1.5" fill="#fff4dc"/>
      <rect x="36" y="47" width="8" height="11" rx="1" fill="#132447"/>
      <!-- roller stroke -->
      <rect x="27" y="41" width="12" height="17" fill="#ffc83d"/>
    </svg>
    <div class="txt"><span class="name">ヒナタ塗装店</span><span class="tag">外壁・屋根塗装 | 地域密着</span></div>
  </div>

  <div class="pill">
    <svg class="leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c0-8 5-14 16-16-1 11-7 16-16 16Z" fill="#132447"/><path d="M6 18c3-5 6-8 11-11" stroke="#ffc83d" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    <span class="pill-text">秋の外壁塗装キャンペーン</span>
  </div>

  <div class="head">
    <div class="lead" id="lead">足場代</div>
    <div class="big" id="big"><span class="num">0</span><span class="unit">円</span></div>
  </div>

  <div class="sub" id="sub">外壁・屋根の塗り替えを<br>まとめてお得に</div>

  <div class="chips" id="chips">
    <span class="chip"><svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#ffc83d"/><path d="M7 12.5l3.2 3L17 8.5" stroke="#132447" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>期間限定</span>
    <span class="chip"><svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#ffc83d"/><path d="M7 12.5l3.2 3L17 8.5" stroke="#132447" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>現地調査 無料</span>
  </div>

  <a class="cta" id="cta">無料見積もりはこちら<svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="M9 7.5l4.5 4.5L9 16.5" stroke="#e26f12" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <div class="note" id="note">お見積もり・ご相談は何度でも無料です</div>

  <div class="leaves">
    <svg viewBox="0 0 400 400" aria-hidden="true">
      <!-- leaves: base + one darker half (light from top-left) -->
      <g transform="translate(60 70) rotate(-25) scale(1.4)"><path d="M0 26C0 10 10 0 26 0c0 16-10 26-26 26Z" fill="#f4862a"/><path d="M0 26L26 0c0 16-10 26-26 26Z" fill="#d9711f"/></g>
      <g transform="translate(300 40) rotate(30) scale(1.1)"><path d="M0 26C0 10 10 0 26 0c0 16-10 26-26 26Z" fill="#ffc83d"/><path d="M0 26L26 0c0 16-10 26-26 26Z" fill="#f2a93b"/></g>
      <g transform="translate(340 210) rotate(140) scale(.9)" opacity=".7"><path d="M0 26C0 10 10 0 26 0c0 16-10 26-26 26Z" fill="#f4862a"/><path d="M0 26L26 0c0 16-10 26-26 26Z" fill="#d9711f"/></g>
      <g class="l4" transform="translate(150 250) rotate(70) scale(.8)" opacity=".6"><path d="M0 26C0 10 10 0 26 0c0 16-10 26-26 26Z" fill="#ffc83d"/><path d="M0 26L26 0c0 16-10 26-26 26Z" fill="#f2a93b"/></g>
    </svg>
  </div>
  <div class="house">
    <!-- flat illustration rules: no outlines / 2-step shading (base + one darker shade) / light from top-left -->
    <svg viewBox="0 0 560 440" aria-hidden="true">
      <defs>
        <radialGradient id="glow"><stop offset="0" stop-color="#ffc83d" stop-opacity=".45"/><stop offset=".5" stop-color="#ffc83d" stop-opacity=".12"/><stop offset="1" stop-color="#ffc83d" stop-opacity="0"/></radialGradient>
        <clipPath id="wallClip"><rect x="112" y="208" width="336" height="188"/></clipPath>
        <clipPath id="sunClip"><circle cx="0" cy="0" r="38"/></clipPath>
        <clipPath id="cloud1"><circle cx="-28" cy="6" r="14"/><circle cx="0" cy="-6" r="21"/><circle cx="27" cy="4" r="15"/><rect x="-40" y="6" width="80" height="14" rx="7"/></clipPath>
        <clipPath id="cloud2"><circle cx="-22" cy="5" r="11"/><circle cx="0" cy="-5" r="17"/><circle cx="21" cy="3" r="12"/><rect x="-32" y="5" width="64" height="11" rx="5"/></clipPath>
        <clipPath id="sleeve"><rect x="-18" y="-52" width="36" height="104" rx="10"/></clipPath>
        <clipPath id="ground"><ellipse cx="312" cy="430" rx="222" ry="46"/></clipPath>
        <clipPath id="b1"><circle cx="132" cy="398" r="22"/></clipPath>
        <clipPath id="b2"><circle cx="160" cy="404" r="16"/></clipPath>
        <clipPath id="b3"><circle cx="150" cy="386" r="13"/></clipPath>
        <clipPath id="b4"><circle cx="500" cy="404" r="15"/></clipPath>
        <clipPath id="b5"><circle cx="522" cy="410" r="10"/></clipPath>
      </defs>
      <!-- sun: disc + soft glow -->
      <g transform="translate(450 70)">
        <circle r="112" fill="url(#glow)"/>
        <g clip-path="url(#sunClip)"><rect x="-40" y="-40" width="80" height="80" fill="#f2a93b"/><circle cx="-6" cy="-6" r="38" fill="#ffc83d"/></g>
      </g>
      <!-- clouds: base white + shade on bottom-right -->
      <g transform="translate(100 118)"><g clip-path="url(#cloud1)"><rect x="-50" y="-30" width="100" height="60" fill="#d3dceb"/><g transform="translate(-4 -5)"><circle cx="-28" cy="6" r="14" fill="#fff"/><circle cx="0" cy="-6" r="21" fill="#fff"/><circle cx="27" cy="4" r="15" fill="#fff"/><rect x="-40" y="6" width="80" height="14" rx="7" fill="#fff"/></g></g></g>
      <g transform="translate(336 62)" opacity=".9"><g clip-path="url(#cloud2)"><rect x="-40" y="-25" width="80" height="50" fill="#d3dceb"/><g transform="translate(-3 -4)"><circle cx="-22" cy="5" r="11" fill="#fff"/><circle cx="0" cy="-5" r="17" fill="#fff"/><circle cx="21" cy="3" r="12" fill="#fff"/><rect x="-32" y="5" width="64" height="11" rx="5" fill="#fff"/></g></g></g>
      <!-- ground: base + darker lower band -->
      <g clip-path="url(#ground)"><rect x="80" y="380" width="460" height="100" fill="#3aa982"/><rect x="80" y="428" width="460" height="60" fill="#2a7f61"/></g>
      <!-- chimney (behind roof): base + right face shade -->
      <rect x="370" y="98" width="34" height="110" fill="#1c3563"/><rect x="396" y="98" width="8" height="110" fill="#132447"/>
      <rect x="364" y="92" width="46" height="12" rx="2" fill="#1c3563"/>
      <!-- wall: old (grey) with eave shadow + right shade -->
      <rect x="112" y="208" width="336" height="188" fill="#b3bccb"/>
      <rect x="112" y="208" width="336" height="16" fill="#98a3b3"/>
      <rect x="434" y="208" width="14" height="188" fill="#98a3b3"/>
      <!-- fresh painted wall (left) with roller edge -->
      <g clip-path="url(#wallClip)">
        <path d="M112 208H318c-6 20 4 40-2 60s4 40-2 60 4 40-2 60 2 20 2 20H112Z" fill="#ffe0b5"/>
        <path d="M112 208H318c-4 12 2 16 -1 16H112Z" fill="#f0c68f"/>
      </g>
      <!-- windows: darker rectangle + one highlight stroke -->
      <rect x="150" y="242" width="70" height="60" rx="4" fill="#6f86ad"/>
      <path d="M160 294L212 250" stroke="#bcd3f0" stroke-width="5" stroke-linecap="round"/>
      <rect x="144" y="302" width="82" height="8" rx="2" fill="#f0c68f"/>
      <rect x="350" y="242" width="70" height="60" rx="4" fill="#6f86ad"/>
      <path d="M360 294L412 250" stroke="#bcd3f0" stroke-width="5" stroke-linecap="round"/>
      <rect x="344" y="302" width="82" height="8" rx="2" fill="#98a3b3"/>
      <!-- door: base + darker inset; knob accent -->
      <rect x="252" y="318" width="56" height="78" rx="4" fill="#1c3563"/>
      <rect x="260" y="328" width="40" height="30" rx="3" fill="#132447"/>
      <circle cx="296" cy="368" r="4" fill="#ffc83d"/>
      <!-- door canopy (庇): lit top + shaded front edge -->
      <path d="M244 300H316L324 312H236Z" fill="#f4862a"/>
      <rect x="236" y="312" width="88" height="7" fill="#c9631a"/>
      <!-- gutter (雨どい) + downspout -->
      <rect x="436" y="208" width="12" height="188" fill="#1c3563"/><rect x="443" y="208" width="5" height="188" fill="#132447"/>
      <rect x="436" y="384" width="26" height="12" rx="3" fill="#1c3563"/>
      <!-- roof: left plane lit, right plane shaded; eave/gutter bar -->
      <path d="M80 206L280 60L280 206Z" fill="#f4862a"/>
      <path d="M280 60L480 206L280 206Z" fill="#d9711f"/>
      <rect x="80" y="198" width="400" height="12" rx="3" fill="#1c3563"/>
      <!-- roller: sleeve base + right shade; handle -->
      <g transform="translate(322 256)">
        <path d="M0 0 L0 40 Q0 62 22 62 L44 62 L44 130" stroke="#1c3563" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="34" y="126" width="20" height="46" rx="8" fill="#1c3563"/>
        <g clip-path="url(#sleeve)"><rect x="-18" y="-52" width="36" height="104" fill="#f4862a"/><rect x="5" y="-52" width="13" height="104" fill="#d9711f"/></g>
      </g>
      <!-- paint bucket: base + right shade, paint rim -->
      <g transform="translate(468 356)">
        <path d="M-26 0h52l-6 54h-40Z" fill="#e9eef5"/>
        <path d="M8 0h18l-6 54h-14Z" fill="#c8d1de"/>

<script>
(function(){
  const q = new URLSearchParams(location.search);
  const size = q.get('size') || 'square';
  const v = (q.get('v') || 'a').toLowerCase();
  const art = (q.get('art') || 'photo').toLowerCase();
  document.body.classList.add('size-' + size, 'v-' + v, 'art-' + art);
  const photo = (q.get('photo') || (v === 'b' ? 'house' : 'wall')).toLowerCase();
  const img = document.querySelector('.photo img');
  img.src = 'photos/ad-' + photo + '.jpg'; img.classList.add('ph-' + photo); document.body.classList.add('photo-' + photo);
  const COPY = {
    a: {
      lead: '足場代',
      big: '<span class="num">0</span><span class="unit">円</span>',
      sub: '外壁・屋根の塗り替えを<br>まとめてお得に',
      chips: ['期間限定', '現地調査 無料'],
      cta: '無料見積もりはこちら',
      ctaShort: '無料見積もり',
      note: 'お見積もり・ご相談は何度でも無料'
    },
    b: {
      lead: '自社職人',
      big: '<span class="num">10</span><span class="unit">年保証</span>',
      sub: '下請けなし・自社職人が<br>責任をもって施工します',
      chips: ['無料点検 実施中', '施工後も安心'],
      cta: '無料点検を予約する',
      ctaShort: '無料点検を予約',
      note: '塗り替え時期の診断も無料です'
    }
  };
  const c = COPY[v] || COPY.a;
  document.getElementById('lead').textContent = c.lead;
  document.getElementById('big').innerHTML = c.big;
  document.getElementById('sub').innerHTML = c.sub;
  const ck = '<svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#ffc83d"/><path d="M7 12.5l3.2 3L17 8.5" stroke="#132447" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  document.getElementById('chips').innerHTML = c.chips.map(t => '<span class="chip">' + ck + t + '</span>').join('');
  const cta = document.getElementById('cta');
  cta.firstChild.textContent = (size === 'rect' && c.ctaShort) ? c.ctaShort : c.cta;
  document.getElementById('note').textContent = c.note;
})();
</script>
