<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MAKING intro 2.0s (1080×1920)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="intro-outro.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1430}
.stage{position:absolute;inset:0;overflow:hidden}
</style>
</head>
<body>
<div class="stage">
<section class="v-intro" style="--v-intro-start:0s">
  <div class="v-grid"></div>
  <div class="v-ghost">MAKING</div>
  <div class="v-band"></div>
  <div class="v-stage">
    <div class="v-mark"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22.5" fill="#2457e6"/><text x="20" y="72.5" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="60" fill="#ffffff">K</text><rect x="64" y="48" width="15" height="24.5" rx="2.5" fill="#f5a524"/></svg></div>
    <div class="v-title"><span class="v-line"><span class="v-word">MAKING</span><span class="v-no">#01</span><i class="v-cur"></i></span></div>
    <div class="v-tag">AIで作って、本番に出す。</div>
  </div>
</section>
</div>
<script>
/* 単体確認用（render-video.mjs の契約: window.__duration / window.__ready / window.__seek(t)） */
window.__duration=2;
window.__ready=(async()=>{ try{ if(document.fonts) await document.fonts.ready; }catch(e){} })();
window.__seek=async function(t){
  await window.__ready;
  const ms=Math.max(0,+t)*1000;
  for(const a of document.getAnimations()){ a.pause(); a.currentTime=ms; }
  void document.body.offsetHeight;
  await new Promise(r=>{ let done=false; const f=()=>{ if(!done){done=true;r();} }; requestAnimationFrame(()=>requestAnimationFrame(f)); setTimeout(f,150); });
  return t;
};
</script>
</body>
</html>
