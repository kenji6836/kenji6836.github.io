<!-- ============================================================
  MAKING イントロ／アウトロ DOM 断片（1080×1920・紺地）
  - CSS: intro-outro.css（同ディレクトリ）。<link> は含めない。ショート側 head で読むフォント:
      Noto Sans JP 700/900・IBM Plex Mono 500（Google Fonts）
  - 使い方: 2 つの <section> をショートの stage 直下にコピー（iframe 不可）。
      イントロは 0.0–2.0s（--v-intro-start 既定 0s）／アウトロは --v-outro-start で開始時刻を指定
      例: <section class="v-outro" style="--v-outro-start:23s">
  - 通番は .v-no のテキストを書き換える（例: #02）
  - JS なし・画像なし（マークはインライン SVG）
  ============================================================ -->
<section class="v-intro" style="--v-intro-start:0s">
  <div class="v-grid"></div>
  <div class="v-ghost">MAKING</div>
  <div class="v-band"></div>
  <div class="v-stage">
    <div class="v-mark"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22.5" fill="#2457e6"/><text x="20" y="72.5" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="60" fill="#ffffff">K</text><rect x="64" y="48" width="15" height="24.5" rx="2.5" fill="#f5a524"/></svg></div>
    <div class="v-title"><span class="v-line"><span class="v-word">MAKING</span><span class="v-no">#01</span><i class="v-cur"></i></span></div>
    <div class="v-tag">AIで作って、本番に出す。</div>
  </div>
</section>

<section class="v-outro" style="--v-outro-start:23s">
  <div class="v-grid"></div>
  <div class="v-ghost">MAKING</div>
  <div class="v-band"></div>
  <div class="v-mark"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22.5" fill="#2457e6"/><text x="20" y="72.5" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="60" fill="#ffffff">K</text><rect x="64" y="48" width="15" height="24.5" rx="2.5" fill="#f5a524"/></svg></div>
  <div class="v-row v-name"><span>Kenji Ido</span></div>
  <div class="v-row v-handle"><span>@idk0723ai</span></div>
  <div class="v-row v-msg"><span>作った実物は HP で</span></div>
  <div class="v-url">kenji6836.github.io<i class="v-cur"></i></div>
</section>
