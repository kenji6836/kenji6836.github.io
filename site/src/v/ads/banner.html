<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見積トリアージ 広告セット（自主制作サンプル・未出稿）</title>
<!--
  usage: node site/tools/cdp-render.mjs "file://$PWD/site/src/v/ads/banner.html" 1700 2100 out/<file> --selector "[data-size='<key>']" --wait 2500 [--scale 2] [--quality 88]
  keys: a-square-1080 / b-square-1080 / a-story-1080x1920 / a-landscape-1200x628 / a-rect-300x250 / a-leaderboard-728x90 / a-x-1600x900
  inputs: ../../photos/kensetsu-*.jpg（自主制作の実写風写真）, a-input/mock-a-1280.png（製品の実画面）, a-input/icon.svg（インライン化）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2457e6; --blue-2:#2f66ff; --blue-3:#1a3fb8; --navy:#0b1430; --ink:#14171f;
  --amber:#ffb020; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1b1e26;font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;color:var(--white);-webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
body{padding:40px;display:flex;flex-direction:column;gap:40px;align-items:flex-start}
section.ad{display:block}
.lbl{font:500 12px/1 Inter,sans-serif;color:#8b93a5;letter-spacing:.06em;margin-bottom:8px}
.ad{position:relative;overflow:hidden;line-height:1.2;
  background:
    radial-gradient(ellipse at 16% 10%, rgba(255,255,255,.16) 0, rgba(255,255,255,0) 46%),
    radial-gradient(ellipse at 100% 100%, rgba(11,20,48,.55) 0, rgba(11,20,48,0) 55%),
    linear-gradient(152deg, var(--blue-2) 0%, var(--blue) 46%, var(--blue-3) 100%)}
.ad>*{position:absolute}

/* photo: cover crop, edge fade into the blue field (mask), light blue tint for unity */
.photo{overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(1.03) brightness(1.04)}
.photo .tint{position:absolute;inset:0;background:rgba(36,87,230,.14);mix-blend-mode:multiply}
.photo .tint2{position:absolute;inset:0;background:rgba(36,87,230,.08)}

/* logo lockup */
.logo{display:flex;align-items:center;gap:.4em;line-height:1;white-space:nowrap}
.logo .mark{flex:none;display:block}
.logo .name{font-weight:900;letter-spacing:.01em;color:var(--white)}
.logo .en{font-family:Inter,sans-serif;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.72);margin-top:.35em}
.logo .txt{display:flex;flex-direction:column}
/* kicker pill (industry) */
.kicker{display:inline-flex;align-items:center;gap:.35em;border:1.5px solid rgba(255,255,255,.42);background:rgba(255,255,255,.12);border-radius:999px;font-weight:700;color:var(--white);white-space:nowrap;line-height:1;letter-spacing:.02em}
/* headline */
.head{white-space:nowrap;font-weight:900;color:var(--white);letter-spacing:.005em}
.head .ln{display:block;line-height:1.12}
.head .ln.big{display:flex;align-items:baseline;gap:.1em;line-height:1}
.head .num{font-family:Inter,"Noto Sans JP",sans-serif;font-weight:800;letter-spacing:-.04em;color:var(--white)}
.head .unit{font-weight:900}
/* body */
.body{font-weight:500;color:rgba(255,255,255,.94);line-height:1.45;letter-spacing:.005em}
.body .nb{white-space:nowrap}
/* CTA */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:.4em;background:var(--white);color:var(--blue);font-weight:900;border-radius:999px;white-space:nowrap;letter-spacing:.02em;line-height:1;box-shadow:0 .3em 1em rgba(5,12,40,.35)}
.cta .arr{flex:none;display:block;width:1.05em;height:1.05em}
/* note */
.note{font-weight:500;color:rgba(255,255,255,.72);white-space:nowrap;letter-spacing:.02em;line-height:1}
/* phone device with product screen crop (mock inbox pane: x 215..606, y 40..900 of 1280×900) */
.device{background:#0d1220;box-shadow:0 40px 80px -24px rgba(5,12,40,.6),0 0 0 1px rgba(255,255,255,.06) inset}
.device .screen{position:relative;overflow:hidden;background:#fff}
.device .screen img{position:absolute;display:block;transform-origin:0 0;clip-path:inset(40px 0 0 215px)}
.device .island{position:absolute;left:50%;transform:translateX(-50%);background:#0d1220;border-radius:999px}
/* photo tile (small sizes) */
.tile{overflow:hidden;box-shadow:0 10px 24px -8px rgba(5,12,40,.55)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92)}

/* ================= SQUARE 1080×1080 ================= */
.s-square .ad{width:1080px;height:1080px}
.s-square .photo{left:460px;top:0;right:0;height:820px;
  mask-image:linear-gradient(90deg,transparent 0,#000 44%),linear-gradient(180deg,#000 68%,transparent 100%);mask-composite:intersect;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 44%),linear-gradient(180deg,#000 68%,transparent 100%);-webkit-mask-composite:source-in}
.s-square .photo img{object-position:4% 50%}
.s-square.v-b .photo img{object-position:34% 40%}
.s-square .logo{left:72px;top:64px}
.s-square .logo .mark{width:64px;height:64px}
.s-square .logo .name{font-size:40px}
.s-square .logo .en{font-size:15px;display:none}
.s-square .kicker{left:466px;top:70px;height:52px;padding:0 20px;font-size:36px}
.s-square .head{left:72px;top:232px;font-size:92px}
.s-square .head .num{font-size:132px}
.s-square .body{left:72px;top:612px;width:600px;font-size:36px}
.s-square.v-b .body{top:472px}
.s-square .device{left:72px;top:800px;width:360px;height:420px;border-radius:44px;padding:10px}
.s-square.v-b .device{top:700px}
.s-square .device .screen{width:340px;height:400px;border-radius:34px}
.s-square .device .screen img{width:1280px;transform:scale(.8696) translate(-215px,-40px);top:38px;left:0}
.s-square .device .island{top:11px;width:92px;height:26px}
.s-square .cta{right:72px;top:872px;height:92px;padding:0 40px;font-size:40px}
.s-square .note{right:72px;top:1004px;font-size:36px}

/* ================= STORY 1080×1920 (text safe: y 270..1536) ================= */
.s-story .ad{width:1080px;height:1920px}
.s-story .photo{left:0;top:0;right:0;height:1040px;
  mask-image:linear-gradient(180deg,#000 56%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,#000 56%,transparent 100%)}
.s-story .photo img{object-position:50% 0%}
.s-story .scrim{left:0;top:0;right:0;height:560px;background:linear-gradient(180deg,rgba(11,20,48,.55) 0,rgba(11,20,48,0) 100%)}
.s-story .logo{left:80px;top:300px;background:rgba(11,20,48,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:10px 30px 10px 10px}
.s-story .logo .mark{width:76px;height:76px}
.s-story .logo .name{font-size:46px}
.s-story .logo .en{font-size:16px;display:none}
.s-story .kicker{left:80px;top:930px;height:56px;padding:0 22px;font-size:36px}
.s-story .head{left:80px;top:1006px;font-size:100px}
.s-story .head .num{font-size:150px}
.s-story .body{left:80px;top:1302px;width:920px;font-size:40px}
.s-story .device{left:80px;top:1440px;width:340px;height:560px;border-radius:44px;padding:10px}
.s-story .device .screen{width:320px;height:540px;border-radius:34px}
.s-story .device .screen img{width:1280px;transform:scale(.8184) translate(-215px,-40px);top:38px;left:0}
.s-story .device .island{top:12px;width:98px;height:28px}
.s-story .cta{right:80px;top:1436px;height:100px;padding:0 44px;font-size:42px}
.s-story .note{right:80px;top:1570px;font-size:36px}

/* ================= LANDSCAPE 1200×628 ================= */
.s-landscape .ad{width:1200px;height:628px}
.s-landscape .photo{left:560px;top:0;right:0;bottom:0;
  mask-image:linear-gradient(90deg,transparent 0,#000 40%),linear-gradient(180deg,#000 70%,transparent 100%);mask-composite:intersect;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40%),linear-gradient(180deg,#000 70%,transparent 100%);-webkit-mask-composite:source-in}
.s-landscape .photo img{object-position:8% 40%}
.s-landscape .logo{left:56px;top:40px}
.s-landscape .logo .mark{width:52px;height:52px}
.s-landscape .logo .name{font-size:36px}
.s-landscape .logo .en{display:none}
.s-landscape .kicker{left:392px;top:42px;height:48px;padding:0 18px;font-size:36px}
.s-landscape .head{left:56px;top:130px;font-size:64px}
.s-landscape .head .num{font-size:92px}
.s-landscape .body{left:56px;top:326px;width:540px;font-size:36px;line-height:1.36}
.s-landscape .device{left:618px;top:290px;width:228px;height:380px;border-radius:30px;padding:7px}
.s-landscape .device .screen{width:214px;height:366px;border-radius:24px}
.s-landscape .device .screen img{width:1280px;transform:scale(.5473) translate(-215px,-40px);top:28px;left:0}
.s-landscape .device .island{top:8px;width:62px;height:18px}
.s-landscape .cta{right:56px;top:508px;height:72px;padding:0 30px;font-size:36px}
.s-landscape .note{left:56px;top:566px;font-size:36px}

/* ================= X 1600×900 ================= */
.s-x .ad{width:1600px;height:900px}
.s-x .photo{left:760px;top:0;right:0;bottom:0;
  mask-image:linear-gradient(90deg,transparent 0,#000 34%),linear-gradient(180deg,#000 70%,transparent 100%);mask-composite:intersect;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%),linear-gradient(180deg,#000 70%,transparent 100%);-webkit-mask-composite:source-in}
.s-x .photo img{object-position:4% 45%}
.s-x .logo{left:80px;top:64px}
.s-x .logo .mark{width:64px;height:64px}
.s-x .logo .name{font-size:44px}
.s-x .logo .en{display:none}
.s-x .kicker{left:500px;top:70px;height:54px;padding:0 22px;font-size:40px}
.s-x .head{left:80px;top:176px;font-size:100px}
.s-x .head .num{font-size:140px}
.s-x .body{left:80px;top:576px;width:720px;font-size:40px}
.s-x .device{left:860px;top:460px;width:300px;height:500px;border-radius:38px;padding:9px}
.s-x .device .screen{width:282px;height:482px;border-radius:30px}
.s-x .device .screen img{width:1280px;transform:scale(.7212) translate(-215px,-40px);top:32px;left:0}
.s-x .device .island{top:10px;width:76px;height:22px}
.s-x .cta{right:80px;top:760px;height:96px;padding:0 44px;font-size:42px}
.s-x .note{left:80px;top:812px;font-size:40px}

/* ================= RECT 300×250 (headline + CTA + icon) ================= */
.s-rect .ad{width:300px;height:250px}
.s-rect .logo{left:16px;top:14px}
.s-rect .logo .mark{width:28px;height:28px}
.s-rect .logo .name{font-size:15px}
.s-rect .logo .en{display:none}
.s-rect .tile{right:16px;top:14px;width:96px;height:96px;border-radius:14px}
.s-rect .tile img{object-position:30% 30%}
.s-rect .head{left:16px;top:56px;font-size:32px}
.s-rect .head .num{font-size:46px}
.s-rect .cta{right:16px;top:180px;height:36px;padding:0 16px;font-size:15px;box-shadow:0 3px 8px rgba(5,12,40,.35)}
.s-rect .note{left:16px;top:226px;font-size:14px}
.s-rect .body,.s-rect .kicker,.s-rect .device,.s-rect .photo{display:none}

/* ================= LEADERBOARD 728×90 (headline + CTA + icon) ================= */
.s-leaderboard .ad{width:728px;height:90px}
.s-leaderboard .logo{left:16px;top:23px}
.s-leaderboard .logo .mark{width:44px;height:44px}
.s-leaderboard .logo .txt{display:none}
.s-leaderboard .head{left:74px;top:14px;font-size:26px;white-space:nowrap}
.s-leaderboard .head .ln{display:inline;line-height:1.1}
.s-leaderboard .head .ln.big{display:inline-flex;align-items:baseline}
.s-leaderboard .head .num{font-size:34px}
.s-leaderboard .note{left:74px;top:52px;font-size:16px}
.s-leaderboard .tile{left:492px;top:16px;width:58px;height:58px;border-radius:12px}
.s-leaderboard .kicker{display:inline-flex;left:386px;top:14px;height:26px;padding:0 9px;font-size:16px;border-width:1px}
.s-leaderboard .tile img{object-position:30% 30%}
.s-leaderboard .cta{right:16px;top:25px;height:40px;padding:0 18px;font-size:18px;box-shadow:0 3px 8px rgba(5,12,40,.35)}
.s-leaderboard .body,.s-leaderboard .device,.s-leaderboard .photo{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mk" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="112" fill="#fff"/>
    <g fill="none" stroke="#2457e6" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M118 262l46-118h184l46 118v112a22 22 0 0 1-22 22H140a22 22 0 0 1-22-22z"/>
      <path d="M118 262h84l24 46h60l24-46h84"/>
    </g>
    <circle cx="372" cy="150" r="46" fill="#ffb020" stroke="#fff" stroke-width="14"/>
  </symbol>
  <symbol id="arr" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="11" fill="#2457e6"/>
    <path d="M9 7.5l4.5 4.5L9 16.5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
<div id="root"></div>
<script>
(function(){
  const COPY = {
    a: {
      head: ['見積依頼の', '仕分け、', {num:'60', unit:'秒。'}],
      headWide: ['見積依頼の仕分け、', {num:'60', unit:'秒。'}],
      headLine: [{inline:'見積依頼の仕分け、'}, {num:'60', unit:'秒。'}],
      body: ['届いた依頼を ','AI が','緊急度・','工種・','概算帯で','仕分け。','概算返信の','下書きまで','自動','（60 秒は目安）。'],
      cta: 'デモを触る'
    },
    b: {
      head: ['急ぎの依頼、', '埋もれない。'],
      headWide: ['急ぎの依頼、', '埋もれない。'],
      headLine: [{inline:'急ぎの依頼、埋もれない。'}],
      body: ['朝の受信箱を','自動で仕分け。','至急だけが','一番上に来る。'],
      cta: '実物を見る'
    }
  };
  const PH = '../../photos/';
  const SIZES = [
    {slot:'a-square-1080',        cls:'s-square',      v:'a', photo:'kensetsu-site-tablet.jpg',     head:'head'},
    {slot:'b-square-1080',        cls:'s-square',      v:'b', photo:'kensetsu-office-desk.jpg',     head:'head'},
    {slot:'a-story-1080x1920',    cls:'s-story',       v:'a', photo:'kensetsu-worker-portrait.jpg', head:'headWide', scrim:true},
    {slot:'a-landscape-1200x628', cls:'s-landscape',   v:'a', photo:'kensetsu-site-tablet.jpg',     head:'headWide'},
    {slot:'a-rect-300x250',       cls:'s-rect',        v:'a', photo:'kensetsu-site-tablet.jpg',     head:'head', tile:true},
    {slot:'a-leaderboard-728x90', cls:'s-leaderboard', v:'a', photo:'kensetsu-site-tablet.jpg',     head:'headLine', tile:true},
    {slot:'a-x-1600x900',         cls:'s-x',           v:'a', photo:'kensetsu-site-tablet.jpg',     head:'head'}
  ];
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const headHTML = lines => lines.map(l => {
    if (typeof l === 'string') return '<span class="ln">' + esc(l) + '</span>';
    if (l.inline) return '<span class="ln">' + esc(l.inline) + '</span>';
    return '<span class="ln big"><span class="num">' + l.num + '</span><span class="unit">' + esc(l.unit) + '</span></span>';
  }).join('');
  const NOTE = '自主制作のサンプル広告（未出稿）';
  document.getElementById('root').innerHTML = SIZES.map(s => {
    const c = COPY[s.v];
    const photo = s.tile
      ? '<div class="tile"><img src="' + PH + s.photo + '" alt=""></div>'
      : '<div class="photo"><img src="' + PH + s.photo + '" alt=""><div class="tint"></div><div class="tint2"></div></div>';
    return '<div class="' + s.cls + ' v-' + s.v + '"><div class="lbl">' + s.slot + '</div>' +
      '<section class="ad" data-size="' + s.slot + '">' +
        photo +
        (s.scrim ? '<div class="scrim"></div>' : '') +
        '<div class="logo"><svg class="mark" aria-hidden="true"><use href="#mk"/></svg><div class="txt"><span class="name">見積トリアージ</span><span class="en">MITSUMORI TRIAGE</span></div></div>' +
        '<div class="kicker">建設業向け</div>' +
        '<div class="head">' + headHTML(c[s.head]) + '</div>' +
        '<div class="body">' + c.body.map(t => '<span class="nb">' + esc(t) + '</span>').join('') + '</div>' +
        '<div class="device"><div class="screen"><img src="a-input/mock-a-1280.png" alt=""></div><div class="island"></div></div>' +
        '<a class="cta">' + esc(c.cta) + '<svg class="arr" aria-hidden="true"><use href="#arr"/></svg></a>' +
        '<div class="note">' + (s.cls === 's-leaderboard' ? '見積トリアージ ・ ' : '') + NOTE + '</div>' +
      '</section></div>';
  }).join('');
})();
</script>
</body>
</html>
