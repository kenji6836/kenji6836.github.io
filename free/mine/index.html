<style>
  .hud { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 12px 0 10px; font-variant-numeric: tabular-nums; }
  .hud b { font-size: 22px; }

    </div>

    <dt>数字の意味は？</dt>

    <dd>スマホはマスを長押し、または「旗モード」をオンにしてタップ。パソコンは右クリックです。</dd>
    <dt>一気に開ける方法は？</dt>
    <dd>数字と同じ数の旗を周りに立てたあと、その数字をタップすると残りの周りのマスをまとめて開けます。</dd>

<footer><div class="wrap">すぐツール — 無料で使えるツールとゲーム ｜ <a href="../">一覧へ</a></div></footer>
<script src="../common.js"></script>
<script>
const LEVELS = [
  { name: "初級", rows: 9, cols: 9, mines: 10 },
  { name: "中級", rows: 16, cols: 16, mines: 40 },
  { name: "上級", rows: 30, cols: 16, mines: 99 }, // スマホ向けに縦長
];
const $ = id => document.getElementById(id);
const board = $("board");
let lv, cells, started, over, opened, flags, timer, t0, flagMode = false;

function nb(i) {
  const { rows, cols } = LEVELS[lv], r = Math.floor(i / cols), c = i % cols, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) out.push(rr * cols + cc);
  }
  return out;
}

function newGame(l) {
  lv = l;
  try { localStorage.setItem("free-mine-lv", l); } catch (e) {}
  const { rows, cols, mines } = LEVELS[lv];
  clearInterval(timer);
  started = over = false; opened = flags = 0;
  $("time").textContent = 0; $("left").textContent = mines; $("result").textContent = ""; $("restart").textContent = "🙂";
  document.querySelectorAll("[data-lv]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.lv === lv)));
  const cs = Math.max(26, Math.min(38, Math.floor((Math.min(innerWidth, 760) - 66) / cols) - 2));
  board.style.setProperty("--cs", cs + "px");
  board.style.gridTemplateColumns = `repeat(${cols}, ${cs}px)`;
  board.innerHTML = "";
  cells = [];
  for (let i = 0; i < rows * cols; i++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "c"; b.dataset.i = i;
    b.setAttribute("aria-label", `${Math.floor(i / cols) + 1}行${i % cols + 1}列`);
    board.appendChild(b);
    cells.push({ el: b, mine: false, n: 0, open: false, flag: false });
  }
  showBest();
}

function placeMines(safe) {
  const { mines } = LEVELS[lv], ban = new Set([safe, ...nb(safe)]);
  const pool = cells.map((_, i) => i).filter(i => !ban.has(i));
  for (let k = 0; k < mines; k++) {
    const j = k + Math.floor(Math.random() * (pool.length - k));
    [pool[k], pool[j]] = [pool[j], pool[k]];
    cells[pool[k]].mine = true;
  }
  cells.forEach((c, i) => c.n = nb(i).filter(j => cells[j].mine).length);
}

function open(i) {
  const stack = [i];
  while (stack.length) {
    const k = stack.pop(), c = cells[k];
    if (c.open || c.flag) continue;
    c.open = true; opened++;
    c.el.classList.add("open");
    if (c.mine) return lose(k);
    if (c.n) { c.el.textContent = c.n; c.el.classList.add("n" + c.n); c.el.setAttribute("aria-label", c.n + ""); }
    else { c.el.setAttribute("aria-label", "空き"); stack.push(...nb(k)); }
  }
  const { rows, cols, mines } = LEVELS[lv];
  if (opened === rows * cols - mines) win();
}

function tap(i) {
  if (over) return;
  const c = cells[i];
  if (flagMode && !c.open) return toggleFlag(i);
  if (!started) {
    placeMines(i); started = true; t0 = Date.now();
    timer = setInterval(() => $("time").textContent = Math.floor((Date.now() - t0) / 1000), 250);
  }
  if (c.open && c.n) { // 旗の数が合っていれば周りをまとめて開ける
    const around = nb(i);
    if (around.filter(j => cells[j].flag).length === c.n) around.forEach(j => !over && open(j));
    return;
  }
  open(i);
}

function toggleFlag(i) {
  const c = cells[i];
  if (over || c.open) return;
  c.flag = !c.flag; flags += c.flag ? 1 : -1;
  c.el.textContent = c.flag ? "🚩" : "";
  c.el.classList.toggle("flag", c.flag);
  $("left").textContent = LEVELS[lv].mines - flags;
  if (navigator.vibrate) navigator.vibrate(15);
}

function lose(k) {
  over = true; clearInterval(timer);
  cells.forEach(c => { if (c.mine && !c.flag) { c.el.textContent = "💣"; c.el.classList.add("open"); } if (!c.mine && c.flag) c.el.textContent = "❌"; });
  cells[k].el.classList.add("boom");
  $("restart").textContent = "😵";
  $("result").textContent = "地雷を踏みました。顔を押すともう一度。";
}

function win() {
  over = true; clearInterval(timer);
  const sec = (Date.now() - t0) / 1000;
  cells.forEach(c => { if (c.mine && !c.flag) { c.flag = true; c.el.textContent = "🚩"; c.el.classList.add("flag"); } });
  $("left").textContent = 0; $("restart").textContent = "😎";
  const key = "free-mine-best-" + lv;
  let best = Infinity; try { best = +localStorage.getItem(key) || Infinity; } catch (e) {}
  const record = sec < best;
  if (record) try { localStorage.setItem(key, sec.toFixed(1)); } catch (e) {}
  $("result").textContent = `クリア！ ${sec.toFixed(1)} 秒${record ? "（自己ベスト更新）" : ""}`;
  showBest();
}

function showBest() {
  const parts = LEVELS.map((L, i) => { let v = null; try { v = localStorage.getItem("free-mine-best-" + i); } catch (e) {} return v ? `${L.name} ${v} 秒` : null; }).filter(Boolean);
  $("best").textContent = parts.length ? "自己ベスト（この端末）: " + parts.join("・") : "";
}

// 操作: タップで開ける・長押しか右クリックで旗
let press = null;
board.addEventListener("contextmenu", e => { e.preventDefault(); const b = e.target.closest(".c"); if (b && !press?.long) toggleFlag(+b.dataset.i); });
board.addEventListener("pointerdown", e => {
  const b = e.target.closest(".c"); if (!b || e.button === 2) return;
  press = { i: +b.dataset.i, long: false, t: setTimeout(() => { press.long = true; toggleFlag(press.i); }, 380) };
});
const cancel = () => { if (press) clearTimeout(press.t); };
board.addEventListener("pointerup", e => {
  if (!press || e.button === 2) return;
  cancel();
  const b = e.target.closest(".c");
  if (!press.long && b && +b.dataset.i === press.i) tap(press.i);
  setTimeout(() => press = null, 0);
});
board.addEventListener("pointerleave", cancel);
board.addEventListener("pointercancel", () => { cancel(); press = null; });
board.addEventListener("keydown", e => { // キーボード: Enter で開ける・F で旗
  const b = e.target.closest(".c"); if (!b) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(+b.dataset.i); }
  if (e.key === "f" || e.key === "F") toggleFlag(+b.dataset.i);
});

$("restart").onclick = () => newGame(lv);
$("flagmode").onclick = e => { flagMode = !flagMode; e.currentTarget.setAttribute("aria-pressed", String(flagMode)); };
document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => newGame(+b.dataset.lv));
let startLv = 0; try { startLv = +localStorage.getItem("free-mine-lv") || 0; } catch (e) {}
newGame(Math.min(startLv, 2));
</script>
