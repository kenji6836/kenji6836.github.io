<script>
/*core-start*/
const KANJI={K:'玉',R:'飛',B:'角',G:'金',S:'銀',N:'桂',L:'香',P:'歩'};
const PROMO={R:'竜',B:'馬',S:'全',N:'圭',L:'杏',P:'と'};
const HAND_ORDER=['R','B','G','S','N','L','P'];
const ZEN='0123456789';
const KAN='一二三四五六七八九';
// SFEN -> {board[9][9] (row0=一, col0=9筋; 'K','+S','k'...), hands{b,w}, turn}
function parseSfen(sfen){
  const parts=sfen.trim().split(/\s+/);
  const board=parts[0].split('/').map(row=>{
    const cells=[];let promo=false;
    for(const ch of row){
      if(ch==='+'){promo=true;continue;}
      if(ch>='1'&&ch<='9'){for(let i=0;i<+ch;i++)cells.push(null);}
      else{cells.push((promo?'+':'')+ch);promo=false;}
    }
    return cells;
  });
  const hands={b:{},w:{}};
  const h=parts[2]||'-';
  if(h!=='-'){for(const m of h.matchAll(/(\d*)([A-Za-z])/g)){const side=m[2]===m[2].toUpperCase()?'b':'w';const k=m[2].toUpperCase();hands[side][k]=(hands[side][k]||0)+(m[1]?+m[1]:1);}}
  return {board,hands,turn:parts[1]||'b'};
}
function pieceKanji(p){const promo=p[0]==='+';const k=p.replace('+','').toUpperCase();return promo?(PROMO[k]||KANJI[k]):KANJI[k];}
function isBlack(p){const k=p.replace('+','');return k===k.toUpperCase();}
function usiSq(s){return {r:s.charCodeAt(1)-97,c:9-+s[0]};}
function moveTo(usi){return usi.replace('+','').slice(2,4);}
function sqJa(sq){return ZEN[+sq[0]]+KAN[sq.charCodeAt(1)-97];}
// USI -> 日本語棋譜 (side 'b'=▲ / 'w'=△, prevTo: 直前の着手先 -> 同)
function usiToJa(usi,board,side,prevTo){
  const mark=side==='b'?'▲':'△';
  let name,suffix='';const to=moveTo(usi);
  if(usi[1]==='*'){name=KANJI[usi[0].toUpperCase()];suffix='打';}
  else{const f=usiSq(usi.slice(0,2));const p=board[f.r][f.c];name=p?pieceKanji(p):'？';if(usi.endsWith('+'))suffix='成';}
  return mark+(prevTo===to?'同':sqJa(to))+name+suffix;
}
function applyMove(board,usi,side){
  const nb=board.map(r=>r.slice());const to=usiSq(moveTo(usi));let piece;
  if(usi[1]==='*'){piece=side==='b'?usi[0].toUpperCase():usi[0].toLowerCase();}
  else{const f=usiSq(usi.slice(0,2));piece=nb[f.r][f.c];nb[f.r][f.c]=null;if(usi.endsWith('+')&&piece&&piece[0]!=='+')piece='+'+piece;}
  nb[to.r][to.c]=piece;return nb;
}
// 問題 -> {first:'▲7二銀打', vars:['△1五玉 ▲2六金打',...]}
function solutionJa(pz){
  const {board}=parseSfen(pz.sfen);
  const first=usiToJa(pz.solution,board,'b',null);
  const b1=applyMove(board,pz.solution,'b');const t1=moveTo(pz.solution);
  const vars=(pz.replies||[]).map(rp=>{
    const g=usiToJa(rp.move,b1,'w',t1);
    if(!rp.answer)return g;
    const b2=applyMove(b1,rp.move,'w');
    return g+' '+usiToJa(rp.answer,b2,'b',moveTo(rp.move));
  });
  return {first,vars};
}
function handJa(h){return HAND_ORDER.filter(k=>h[k]).map(k=>KANJI[k]+(h[k]>1?h[k]:'')).join(' ')||'なし';}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function jstToday(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10);}
function shiftDate(d,n){const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function isValidDate(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;const t=Date.parse(d+'T00:00:00Z');return !isNaN(t)&&new Date(t).toISOString().slice(0,10)===d;}
function pickIndex(d,n){return hashStr(d)%n;}
/*core-end*/
(function(){
  const $=id=>document.getElementById(id);
  const today=jstToday();let puzzles=null,cur=null;
  const STORE_NAME='tsume-daily.solved.v1',DAYS=30,WD='日月火水木金土';
  // 解答済みの日付 {'YYYY-MM-DD':true}。localStorage が無くても壊れないよう読み書きは try/catch
  let solved=loadSolved();
  function loadSolved(){try{const v=JSON.parse(localStorage.getItem(STORE_NAME)||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{};}catch(e){return {};}}
  function saveSolved(){try{localStorage.setItem(STORE_NAME,JSON.stringify(solved));}catch(e){}}
  function dateJa(d){const t=new Date(d+'T00:00:00Z');return (t.getUTCMonth()+1)+'月'+t.getUTCDate()+'日（'+WD[t.getUTCDay()]+'）';}
  function fromParam(){const m=location.search.match(/[?&]d=(\d{4}-\d{2}-\d{2})/);return m&&isValidDate(m[1])?m[1]:null;}
  function setUrl(d){try{history.replaceState(null,'',location.pathname+'?d='+d);}catch(e){}}
  function renderBoard(board){
    const files=[9,8,7,6,5,4,3,2,1].map(f=>'<div class="fl">'+f+'</div>').join('');
    let cells='';
    for(const row of board)for(const p of row)cells+='<div class="sq">'+(p?'<span class="p'+(isBlack(p)?'':' w')+'">'+pieceKanji(p)+'</span>':'')+'</div>';
    const ranks=[...KAN].map(k=>'<div class="rl">'+k+'</div>').join('');
    $('board').innerHTML='<div class="files">'+files+'</div><div></div><div class="grid">'+cells+'</div><div class="ranks">'+ranks+'</div>';
  }
  function puzzleFor(d){return puzzles[pickIndex(d,puzzles.length)];}
  function current(){return puzzleFor(cur);}
  function renderPast(){
    let html='',n=0;
    for(let i=0;i<DAYS;i++){
      const d=shiftDate(today,-i),pz=puzzleFor(d),ok=!!solved[d];if(ok)n++;
      html+='<li><button type="button" data-d="'+d+'"'+(d===cur?' aria-current="true"':'')+'><span class="pd">'+dateJa(d)+(i===0?'<span class="today">今日</span>':'')+'</span><span class="pt">'+pz.plies+'手詰</span><span class="ps'+(ok?' ok':'')+'">'+(ok?'解いた':'未解答')+'</span></button></li>';
    }
    $('past-list').innerHTML=html;
    $('past-count').textContent='解いた '+n+' / '+DAYS;
  }
  function show(d){
    cur=d;const pz=current();const {board,hands}=parseSfen(pz.sfen);
    $('date').textContent=dateJa(d);$('date').setAttribute('datetime',d);
    $('meta').innerHTML=(d===today?'<span class="tag">今日の問題</span>':'')+d.slice(0,4)+'年 ・ '+pz.plies+'手詰 ・ 先手番 ・ No.'+pz.id;
    renderBoard(board);
    $('hand').innerHTML='<b>先手の持ち駒</b>'+handJa(hands.b);
    $('answer').hidden=true;$('show').textContent='答えを見る';$('show').setAttribute('aria-expanded','false');
    $('next').disabled=d>=today;
    setUrl(d);renderPast();
  }
  $('prev').onclick=()=>show(shiftDate(cur,-1));
  $('next').onclick=()=>{if(cur<today)show(shiftDate(cur,1));};
  $('show').onclick=()=>{
    const a=$('answer');
    if(!a.hidden){a.hidden=true;$('show').textContent='答えを見る';$('show').setAttribute('aria-expanded','false');return;}
    const pz=current();const s=solutionJa(pz);
    a.innerHTML='<p class="first">'+s.first+'</p>'+s.vars.map(v=>'<p class="v">'+v+'</p>').join('')+'<p class="v">まで'+pz.plies+'手詰</p>';
    a.hidden=false;$('show').textContent='答えを隠す';$('show').setAttribute('aria-expanded','true');
    if(!solved[cur]){solved[cur]=true;saveSolved();renderPast();}
  };
  $('past-list').addEventListener('click',e=>{
    const b=e.target.closest('button[data-d]');if(!b||!puzzles)return;
    show(b.getAttribute('data-d'));window.scrollTo(0,0);
  });
  function start(list){puzzles=list;let d=fromParam()||today;if(d>today)d=today;show(d);}
  const inline=JSON.parse($('data').textContent);
  if(location.protocol==='file:'){start(inline);}
  else{
    Promise.all(['puzzles/puzzles-1te.json','puzzles/puzzles-3te.json'].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})))
      .then(([a,b])=>start(a.concat(b))).catch(()=>start(inline));
  }
})();
</script>
